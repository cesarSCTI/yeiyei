services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: yeiyeisw_swimming
      DB_USER: yams
      DB_PASS: ${DB_PASSWORD:-yams-local-dev}

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: yeiyeisw_swimming
      MARIADB_USER: yams
      MARIADB_PASSWORD: ${DB_PASSWORD:-yams-local-dev}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_ROOT_HOST: localhost
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
 
  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: [admin]
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 16M

volumes:
  db_data:

